[herdr]
# Override when herdr is not on PATH.
bin = herdr
fallback_cwd = ~

[archive]
# Archive indexing reads local agent conversation histories and is disabled by default.
enabled = false
# The picker browses this many days at a time without rebuilding the catalog.
window_days = 14
agents = codex, claude, opencode

[archive.codex]
sessions = ~/.codex/sessions/**/*.jsonl
thread_names = ~/.codex/session_index.jsonl
resume = codex resume -C "{cwd}" {session_id}
# Native uses `herdr agent start`; shell runs the complete resume command in the pane.
launcher = agent
kind = codex
start_timeout_ms = 60000

[archive.claude]
sessions = ~/.claude/projects/*/*.jsonl
resume = claude --resume {session_id}
launcher = agent
kind = claude
start_timeout_ms = 60000

[machines]
# Merge live results from Herdr's saved SSH machines (`herdr machine add`).
# Nothing happens until a machine is saved; each remote needs OmniSearch 0.8.0+.
enabled = true
# Labels or SSH targets to leave out.
exclude =
sync_seconds = 30
ssh = ssh
connect_timeout_seconds = 5
timeout_seconds = 20

[archive.opencode]
# OpenCode keeps history in its own storage; sessions are listed from it
# read-only and exported with `opencode export`. Paths default to the
# XDG data directory.
# database = ~/.local/share/opencode/opencode.db
# storage = ~/.local/share/opencode/storage
# Override when opencode is not on PATH; archived sessions are included.
# export = opencode export {session_id}
resume = opencode --session {session_id}
launcher = agent
kind = opencode
start_timeout_ms = 60000

[skip]
pane_label_contains = omnisearch
unknown_without_agent = true
# One pair per line or comma separated. Format: workspace label|cwd
workspace_cwd_pairs =

[workspace_labels]
# Strip date prefixes like 20260609- automatically. These extra prefixes are optional.
strip_prefixes =
# If cwd contains one of these path parts, the following path part becomes the space label.
worktree_markers = worktrees
remove_words =

[workspace_labels.exact]
# /path/to/project = Friendly Space Name
